name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Attaches the binary to that release."
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build x86_64 Ubuntu 24.04 binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install clipboard system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev musl-tools

      # Build a statically-linked musl binary so the release asset bundles libc
      # and runs on any Linux regardless of the host glibc version (avoids
      # "version `GLIBC_2.xx' not found" at runtime on older distros).
      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Rename binary with target triple
        shell: bash
        run: |
          BIN=pytorch-trace-tui
          ASSET="${BIN}-x86_64-unknown-linux-musl"
          cp "target/x86_64-unknown-linux-musl/release/${BIN}" "$ASSET"
          chmod +x "$ASSET"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      # Determine the release to publish to:
      #  - tag push / manual dispatch -> versioned release (that tag)
      #  - master push                -> rolling "latest" prerelease
      - name: Resolve release target
        id: target
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          prerelease: ${{ steps.target.outputs.prerelease }}
          name: ${{ steps.target.outputs.tag == 'latest' && 'Latest build (master)' || steps.target.outputs.tag }}
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

[package]
name = "pytorch-trace-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI for exploring GPU kernels in PyTorch profiler traces, Perfetto-style"
license = "MIT"
repository = "https://github.com/mpashkovskiy/pytorch-trace-tui"
readme = "README.md"
keywords = ["pytorch", "profiler", "gpu", "tui", "trace"]
categories = ["command-line-utilities", "visualization"]

[[bin]]
name = "pytorch-trace-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
flate2 = "1"
arboard = { version = "3.6", features = ["wayland-data-control"] }
similar = "3"
rmcp = { version = "3.1.4", features = ["server", "transport-io", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1.2.2"

[profile.release]
strip = true
